[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-advisor"
version = "1.0.0"
description = "Deterministic, offline project-management decision engine (WBS, CPM, capacity, risk, PERT/Monte Carlo)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kyaw Kyaw Oo", email = "kyaw.tech@gmail.com" }]
keywords = [
  "project-management",
  "critical-path",
  "pert",
  "monte-carlo",
  "capacity-planning",
  "risk-register",
  "crewai",
  "portfolio",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
project-advisor = "project_advisor.cli:main"

[project.urls]
Homepage = "https://github.com/MrKyaw/Agentic-Project-Agnostic-Management-Advisor"

[tool.setuptools]
packages = ["project_advisor"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["project_advisor"]
branch = true
omit = []

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
precision = 2
